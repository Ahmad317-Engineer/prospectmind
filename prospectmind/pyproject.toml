[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectmind"
version = "0.1.0"
description = "AI-powered B2B outreach personalization engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmad317-Engineer" }]
requires-python = ">=3.10"
keywords = ["cold-email", "sales", "personalization", "b2b", "outreach", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13",
    "lxml>=5",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.30", "anthropic>=0.30"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "openai>=1.30",
    "anthropic>=0.30",
]

[project.scripts]
prospectmind = "prospectmind.cli:entry_point"

[project.urls]
Homepage = "https://github.com/Ahmad317-Engineer/prospectmind"
Repository = "https://github.com/Ahmad317-Engineer/prospectmind"
Issues = "https://github.com/Ahmad317-Engineer/prospectmind/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["prospectmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 99
target-version = "py310"
